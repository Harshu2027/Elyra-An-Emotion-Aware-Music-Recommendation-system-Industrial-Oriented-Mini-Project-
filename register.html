<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register - Elyra</title>
  <link rel="stylesheet" href="style.css">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

<section class="auth-section">
  <div class="auth-box">
    <h1>Register</h1>

    <form id="registerForm">

      <input type="text" id="name" placeholder="Full Name">
      <small class="error" id="nameError"></small>

      <input type="email" id="email" placeholder="Enter Gmail">
      <small class="error" id="emailError"></small>

      <div class="password-box">
        <input type="password" id="password" placeholder="Password">
        <i class="fa fa-eye" id="togglePassword"></i>
      </div>
      <small class="error" id="passwordError"></small>

      <div class="password-box">
        <input type="password" id="confirmPassword" placeholder="Confirm Password">
        <i class="fa fa-eye" id="toggleConfirm"></i>
      </div>
      <small class="error" id="confirmError"></small>

      <button class="btn" type="submit">Register</button>

    </form>
  </div>
</section>

<script>
const name = document.getElementById("name");
const email = document.getElementById("email");
const password = document.getElementById("password");
const confirmPassword = document.getElementById("confirmPassword");

const nameError = document.getElementById("nameError");
const emailError = document.getElementById("emailError");
const passwordError = document.getElementById("passwordError");
const confirmError = document.getElementById("confirmError");

document.getElementById("registerForm").addEventListener("submit", function(e){
  e.preventDefault();

  let valid = true;

  const emailPattern = /^[a-zA-Z0-9._%+-]+@gmail\.com$/;
  const passwordPattern = /^(?=.*[a-z])(?=.*[A-Z])(?=.*[\W_]).{8,}$/;

  nameError.textContent = "";
  emailError.textContent = "";
  passwordError.textContent = "";
  confirmError.textContent = "";

  if(name.value.trim() === ""){
    nameError.textContent = "Enter your name";
    valid = false;
  }

  if(!emailPattern.test(email.value)){
    emailError.textContent = "Enter valid Gmail (@gmail.com)";
    valid = false;
  }

  if(!passwordPattern.test(password.value)){
    passwordError.textContent = "Weak password";
    valid = false;
  }

  if(password.value !== confirmPassword.value){
    confirmError.textContent = "Passwords do not match";
    valid = false;
  }

  if(valid){
    alert("Registered Successfully 🎉");
    window.location.href = "login.html";
  }
});

// eye toggle
document.getElementById("togglePassword").onclick = () => {
  password.type = password.type === "password" ? "text" : "password";
};

document.getElementById("toggleConfirm").onclick = () => {
  confirmPassword.type = confirmPassword.type === "password" ? "text" : "password";
};
</script>

</body>
</html>
